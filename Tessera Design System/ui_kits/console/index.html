<!-- @dsCard group="Console" viewport="1440x900" name="Console app" subtitle="Login, overview, traffic with request detail, policies" -->
<!doctype html><html><head><meta charset="utf-8"><title>Tessera Console</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script><script src="data.js"></script>
</head><body><div id="root"></div>
<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="Topbar.jsx"></script>
<script type="text/babel" src="Overview.jsx"></script>
<script type="text/babel" src="Traffic.jsx"></script>
<script type="text/babel" src="Policies.jsx"></script>
<script type="text/babel" src="Login.jsx"></script>
<script type="text/babel">
const { Toast } = window.TesseraDesignSystem_992529;
function App(){
  const [screen,setScreen]=React.useState(()=>localStorage.getItem('ts-console-screen')||'overview');
  const [authed,setAuthed]=React.useState(()=>localStorage.getItem('ts-console-authed')==='1');
  const [sel,setSel]=React.useState(null);const [t,setT]=React.useState(null);
  const go=s=>{setScreen(s);localStorage.setItem('ts-console-screen',s);};
  const toast=x=>{setT(x);clearTimeout(window.__tt);window.__tt=setTimeout(()=>setT(null),3200);};
  if(!authed) return <Login onIn={()=>{setAuthed(true);localStorage.setItem('ts-console-authed','1');}}/>;
  return <div style={{display:'flex',minHeight:'100vh'}}>
    <Sidebar screen={screen} go={go}/>
    <main style={{flex:1,minWidth:0,display:'flex',flexDirection:'column'}}>
      {screen==='overview'&&<Overview go={go} openReq={r=>{setSel(r);go('traffic');}}/>}
      {screen==='traffic'&&<Traffic sel={sel} setSel={setSel} onAllow={r=>toast({status:'passed',title:'Exception added',message:r.rule+' on '+r.r,meta:'expires in 24h'})}/>}
      {screen==='policies'&&<Policies toast={toast}/>}
      {screen==='settings'&&<><Topbar title="Settings"/><div style={{padding:32,color:'var(--text-muted)',font:'400 14px var(--font-sans)'}}>Settings is not part of this kit. <a href="#" onClick={e=>{e.preventDefault();setAuthed(false);localStorage.setItem('ts-console-authed','0');}}>Sign out</a> to see the login screen.</div></>}
    </main>
    {t&&<div style={{position:'fixed',right:24,bottom:24,zIndex:200}}><Toast {...t} onClose={()=>setT(null)}/></div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
