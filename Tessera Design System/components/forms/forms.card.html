</head><body><div id="root"></div><script type="text/babel">
const NS = window.TesseraDesignSystem_992529;
const { Input, Select, Checkbox, Radio, Switch } = NS;
function App(){return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>

</div>}
