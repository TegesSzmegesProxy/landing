<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--surface-page);font-family:var(--font-sans)}.m{font:500 11px/1.3 var(--font-mono);color:var(--text-muted);letter-spacing:.02em}.k{font:500 12px/1.3 var(--font-sans);color:var(--text-strong)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px"><div style="height:64px;border-radius:var(--radius-sm);background:var(--status-blocked-bg);color:var(--clay-600);display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px"><span style="font:500 12px var(--font-mono);text-transform:uppercase;letter-spacing:.06em">Blocked</span><span class="m" style="color:inherit;opacity:.8">--status-blocked-bg</span></div><div style="height:64px;border-radius:var(--radius-sm);background:var(--status-passed-bg);color:var(--verdigris-600);display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px"><span style="font:500 12px var(--font-mono);text-transform:uppercase;letter-spacing:.06em">Passed</span><span class="m" style="color:inherit;opacity:.8">--status-passed-bg</span></div><div style="height:64px;border-radius:var(--radius-sm);background:var(--status-review-bg);color:var(--ochre-600);display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px"><span style="font:500 12px var(--font-mono);text-transform:uppercase;letter-spacing:.06em">Review</span><span class="m" style="color:inherit;opacity:.8">--status-review-bg</span></div><div style="height:64px;border-radius:var(--radius-sm);background:var(--status-jev-bg);color:var(--blue-700);display:flex;flex-direction:column;justify-content:space-between;padding:10px 12px"><span style="font:500 12px var(--font-mono);text-transform:uppercase;letter-spacing:.06em">JEV</span><span class="m" style="color:inherit;opacity:.8">--status-jev-bg</span></div></div></body></html>
