<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--surface-page);font-family:var(--font-sans)}.m{font:500 11px/1.3 var(--font-mono);color:var(--text-muted);letter-spacing:.02em}.k{font:500 12px/1.3 var(--font-sans);color:var(--text-strong)}</style></head><body><div style="position:relative;height:212px;border-radius:var(--radius-lg);overflow:hidden;background:url(../assets/pixel/hero-amphitheatre-day.png) center 60%/cover;image-rendering:pixelated"><div style="position:absolute;left:24px;top:28px;width:300px;padding:20px;border-radius:var(--radius-lg);background:var(--surface-glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.5);box-shadow:var(--shadow-3)"><div style="font:500 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--stone-600)">--surface-glass</div><div style="font:400 20px/1.2 var(--font-sans);letter-spacing:-.02em;color:var(--ink-900);margin-top:8px">Bone at 72%, 18px blur, white hairline.</div></div><div style="position:absolute;right:24px;bottom:24px;width:260px;padding:18px;border-radius:var(--radius-lg);background:var(--surface-glass-dark);backdrop-filter:blur(18px);border:1px solid var(--border-glass)"><div style="font:500 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--bone-500)">--surface-glass-dark</div><div style="font:400 16px/1.3 var(--font-sans);color:var(--bone-100);margin-top:6px">rgba(31,31,31,.70)</div></div></div></body></html>
