<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--surface-page);font-family:var(--font-sans)}.m{font:500 11px/1.3 var(--font-mono);color:var(--text-muted);letter-spacing:.02em}.k{font:500 12px/1.3 var(--font-sans);color:var(--text-strong)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:8px"><div style="height:90px;background:var(--surface-card);border-radius:var(--radius-md);border:1px solid var(--border-default);padding:12px;display:flex;flex-direction:column;justify-content:flex-end"><span class="k">none</span><span class="m">border only</span></div><div style="height:90px;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-1);padding:12px;display:flex;flex-direction:column;justify-content:flex-end"><span class="k">shadow-1</span><span class="m">cards, tiles</span></div><div style="height:90px;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-2);padding:12px;display:flex;flex-direction:column;justify-content:flex-end"><span class="k">shadow-2</span><span class="m">menus, hover</span></div><div style="height:90px;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-3);padding:12px;display:flex;flex-direction:column;justify-content:flex-end"><span class="k">shadow-3</span><span class="m">dialogs, glass</span></div></div></body></html>
