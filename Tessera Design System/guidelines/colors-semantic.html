<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--surface-page);font-family:var(--font-sans)}.m{font:500 11px/1.3 var(--font-mono);color:var(--text-muted);letter-spacing:.02em}.k{font:500 12px/1.3 var(--font-sans);color:var(--text-strong)}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:72px;background:var(--clay-500);border-radius:var(--radius-sm);border:1px solid var(--border-subtle)"></div><div class="k">Clay · blocked</div><div class="m">--clay-500<br>#B4492F</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:72px;background:var(--verdigris-500);border-radius:var(--radius-sm);border:1px solid var(--border-subtle)"></div><div class="k">Verdigris · passed</div><div class="m">--verdigris-500<br>#4F7F5E</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:72px;background:var(--ochre-500);border-radius:var(--radius-sm);border:1px solid var(--border-subtle)"></div><div class="k">Ochre · review</div><div class="m">--ochre-500<br>#B8862C</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:72px;background:var(--blue-600);border-radius:var(--radius-sm);border:1px solid var(--border-subtle)"></div><div class="k">Blue · JEV</div><div class="m">--blue-600<br>#2F86A4</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:72px;background:var(--terracotta-500);border-radius:var(--radius-sm);border:1px solid var(--border-subtle)"></div><div class="k">Terracotta · tessera</div><div class="m">--terracotta-500<br>#B26F48</div></div></div></body></html>
