<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--surface-page);font-family:var(--font-sans)}.m{font:500 11px/1.3 var(--font-mono);color:var(--text-muted);letter-spacing:.02em}.k{font:500 12px/1.3 var(--font-sans);color:var(--text-strong)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px"><div style="padding:12px;border:1px solid var(--border-default);border-radius:var(--radius-md);height:100px;display:flex;flex-direction:column;justify-content:space-between"><div class="k">Default</div><div><div class="m" style="color:var(--text-strong)">--ease-out</div><div class="m">.22,.8,.24,1</div></div></div><div style="padding:12px;border:1px solid var(--border-default);border-radius:var(--radius-md);height:100px;display:flex;flex-direction:column;justify-content:space-between"><div class="k">Layout</div><div><div class="m" style="color:var(--text-strong)">--ease-in-out</div><div class="m">.65,0,.35,1</div></div></div><div style="padding:12px;border:1px solid var(--border-default);border-radius:var(--radius-md);height:100px;display:flex;flex-direction:column;justify-content:space-between"><div class="k">Pixel art</div><div><div class="m" style="color:var(--text-strong)">--ease-step</div><div class="m">steps(4)</div></div></div><div style="padding:12px;border:1px solid var(--border-default);border-radius:var(--radius-md);height:100px;display:flex;flex-direction:column;justify-content:space-between"><div class="k">fast · base · slow · reveal</div><div><div class="m" style="color:var(--text-strong)">--dur-*</div><div class="m">120 / 220 / 480 / 700</div></div></div></div></body></html>
